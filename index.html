<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โคตรพร้อม เข้างาน</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai+Looped:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ธีมโคตรพร้อม: ส้มนำ ขาวรอง · ฟอนต์ไทยมีหัว · ปุ่มใหญ่กดยุบ · สีเขียว/เหลือง/แดงใช้บอกความหมายเท่านั้น
     (ทุกร้านใช้ธีมเดียวกัน เปลี่ยนแค่ชื่อร้านที่หัวจอ) */
  :root {
    --bg: #FFF9F3; --card: #ffffff; --ink: #21140D; --muted: #5E4B3F; --line: #F0E2D5;
    --brand: #EA580C; --brand-ink: #C2410C; --brand-edge: #9A3412; --brand-soft: #FFE8D4; --brand-50: #FFF5EC; --brand-500: #F97316;
    --ok: #157A3A; --ok-soft: #E2F7E8; --warn: #8A5A00; --warn-soft: #FFF2CC;
    --bad: #B42318; --bad-soft: #FDE7E4; --night: #21140D;
    --r: 26px; --shadow: 0 2px 0 #F0E2D5, 0 12px 24px -14px rgba(124,45,18,.22);
    --display: "Mali", "Noto Sans Thai Looped", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans Thai Looped", "Sukhumvit Set", "Leelawadee UI", sans-serif;
    font-size: 19px; line-height: 1.55; }
  body { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
  .num { font-variant-numeric: tabular-nums; }

  header { padding: 18px 20px 6px; max-width: 560px; margin: 0 auto; display: flex; align-items: flex-end; gap: 12px; }
  header .who { flex: 1; min-width: 0; }
  header .shop { color: var(--muted); font-size: 15px; font-weight: 500; }
  header .mark { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-500); display: grid; place-items: center; flex: none; align-self: center; }
  header h1 { font-family: var(--display); margin: 0; font-size: 26px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .date { background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 15px; font-weight: 600; box-shadow: var(--shadow); white-space: nowrap; }
  main { padding: 10px 16px 0; max-width: 560px; margin: 0 auto; }

  .card { background: var(--card); border-radius: var(--r); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card { border: 2px solid var(--line); }
  .card h2 { font-family: var(--display); margin: 0 0 10px; font-size: 21px; font-weight: 700; }
  .muted { color: var(--muted); font-size: 16px; }
  .center { text-align: center; }

  /* การ์ดใหญ่ด้านบน: นาฬิกา + สถานะ */
  .hero { text-align: center; padding: 22px 20px 20px; }
  .hero .hm { line-height: 0; margin-bottom: 6px; }
  .clock { font-family: var(--display); font-size: 64px; font-weight: 700; line-height: 1.05; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 6px 16px;
    border-radius: 999px; background: #f1efea; font-size: 17px; font-weight: 600; }
  .status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #b9b4aa; }
  .status.ok { background: var(--ok-soft); color: var(--ok); } .status.ok::before { background: var(--ok); }
  .status.bad { background: var(--bad-soft); color: var(--bad); } .status.bad::before { background: var(--bad); }
  .status.warn { background: var(--warn-soft); color: var(--warn); } .status.warn::before { background: #e0a100; }
  .result { margin-top: 14px; font-size: 30px; font-weight: 700; }
  .result small { display: block; font-size: 16px; font-weight: 500; color: var(--muted); }
  .icon { font-size: 52px; line-height: 1.1; }

  /* ปุ่ม */
  button { font: inherit; border: 0; cursor: pointer; touch-action: manipulation; color: inherit; background: none; }
  .btn { display: block; width: 100%; min-height: 88px; padding: 14px 18px; border-radius: var(--r); margin-bottom: 6px;
    background: var(--brand); color: #fff; font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.2;
    box-shadow: 0 6px 0 var(--brand-edge); transition: transform .06s, box-shadow .06s; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--brand-edge); }
  .btn small { display: block; font-family: "Noto Sans Thai Looped", sans-serif; font-size: 18px; font-weight: 600; margin-top: 4px; }
  .btn.green { background: var(--brand); }
  .btn.orange { background: var(--ink); box-shadow: 0 6px 0 #000; }
  .btn.confirm, .btn.quiet.confirm { background: repeating-linear-gradient(-45deg, #B42318 0 18px, #9C1D13 18px 36px); color: #fff; border-color: #B42318; box-shadow: 0 6px 0 #7A1810; }
  .btn.quiet { background: #fff; color: var(--brand-ink); border: 3px solid #FFD0A8; box-shadow: 0 6px 0 #FFD0A8;
    min-height: 66px; font-size: 22px; }
  .btn.quiet small { font-size: 16px; color: var(--muted); }
  .btn.quiet.confirm small { color: #fff; }
  .btn[disabled] { opacity: .45; box-shadow: none; }
  .hint { display: block; width: fit-content; margin: 12px auto 0; padding: 6px 16px; border-radius: 999px;
    background: var(--ok-soft); color: var(--ok); font-size: 17px; font-weight: 600; }
  .small-btn { min-height: 48px; padding: 8px 18px; border-radius: 16px; background: var(--brand); color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 3px 0 var(--brand-edge); }
  .small-btn.ghost { background: #fff; color: var(--brand-ink); border: 2px solid #FFD0A8; box-shadow: 0 3px 0 #FFD0A8; }
  .small-btn.green { background: var(--brand); } .small-btn.red { background: #fff; color: var(--bad); border: 2px solid #f3c4bf; box-shadow: 0 3px 0 #f3c4bf; }
  .gap { height: 18px; }

  /* คนที่ยังอยู่ */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 6px 14px; border-radius: 999px; background: var(--brand-soft); color: #9a3412; font-weight: 600; font-size: 17px; }
  .chip.grey { background: #f1efea; color: var(--muted); font-weight: 500; }
  .note { border-radius: 16px; padding: 12px 16px; margin-top: 12px; font-size: 17px; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.ok { background: var(--ok-soft); color: var(--ok); }
  .note.bad { background: var(--bad-soft); color: var(--bad); }

  /* แถบเมนูล่าง */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; gap: 4px;
    background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
  nav.tabs button { flex: 1; max-width: 140px; min-height: 64px; border-radius: 20px; font-size: 15px; font-weight: 700; color: var(--muted); }
  nav.tabs button svg { display: block; margin: 0 auto 2px; width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button.on { background: var(--brand-soft); color: var(--brand-edge); }

  /* ตัวเลือก */
  .seg { display: flex; gap: 8px; margin-bottom: 14px; }
  .seg button { flex: 1; min-width: 0; min-height: 52px; border-radius: 14px; background: #fff; border: 2px solid var(--line); font-size: 17px; font-weight: 600; padding: 6px 2px; white-space: nowrap; }
  .seg button.on { border-color: var(--brand); background: var(--brand-50); color: var(--brand-edge); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal .dow { text-align: center; font-size: 14px; color: var(--muted); font-weight: 600; }
  .cal button { min-height: 52px; border-radius: 12px; background: #faf9f6; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cal button[disabled] { background: transparent; color: #c9c5bd; text-decoration: line-through; }
  .cal .mon { grid-column: 1 / -1; font-size: 15px; color: var(--muted); font-weight: 600; margin-top: 4px; }

  /* รายการ */
  .list { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .main { flex: 1; min-width: 0; }
  .item .name { font-weight: 700; font-size: 18px; }
  .item .sub { color: var(--muted); font-size: 15px; }
  .item .amt { text-align: right; font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
  .item .amt small { display: block; font-weight: 500; font-size: 14px; color: var(--muted); }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; padding-top: 12px; border-top: 2px solid var(--line); font-weight: 700; font-size: 22px; }
  .pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #f1efea; color: var(--muted); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }

  input, select { font: inherit; font-size: 19px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); min-height: 52px; max-width: 100%; }
  input:focus, select:focus { outline: none; border-color: var(--brand); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  pre { white-space: pre-wrap; word-break: break-word; font: inherit; font-size: 17px; line-height: 1.7; margin: 0; }

  #toast { position: fixed; left: 12px; right: 12px; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 9; max-width: 536px; margin: 0 auto;
    display: none; padding: 16px 18px; border-radius: 20px; background: var(--ink); color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  #toast.ok { background: #14532d; } #toast.bad { background: #7f1d1d; } #toast.warn { background: #78350f; }
  #toast pre { font-size: 17px; line-height: 1.6; }
  .cal button i { display: block; font-style: normal; font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1; }
  .cal button.on i { color: #fff; }
  .cal button.pend { background: var(--warn-soft); box-shadow: inset 0 0 0 2px #f0c64a; }
  .cal button.appr { background: var(--ok-soft); color: var(--ok); box-shadow: inset 0 0 0 2px #B7E4C4; }
  .cal button.rej  { background: var(--bad-soft); box-shadow: inset 0 0 0 2px #ef8a80; }
  .cal button.on   { background: var(--brand); color: #fff; box-shadow: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 4px; vertical-align: -1px; }
  .dot.on { background: var(--brand); } .dot.pend { background: #f0c64a; } .dot.appr { background: var(--ok); } .dot.rej { background: #ef8a80; }
  .pill.blue { background: var(--ok-soft); color: var(--ok); }
  .mbox { margin-top: 10px; padding: 12px; border-radius: 20px; background: var(--brand-50); border: 3px solid var(--brand-500); }
  .mbox input[type=time], .mbox select { min-height: 44px; font-size: 17px; padding: 6px 8px; width: 120px; }
  .mrow { margin-top: 10px; flex-wrap: nowrap; }
  .mlabel { flex: 1; min-width: 0; font-weight: 600; font-size: 17px; line-height: 1.3; }
  nav.tabs button { font-size: 13px; padding: 0 2px; }
  /* ---------- หน้ารอโหลด: ชามลาบเด้ง + จุดวิ่ง + การ์ดเงาวิบวับ ---------- */
  .loading { text-align: center; padding: 30px 20px 26px; }
  .loading .bowl { min-height: 76px; line-height: 0; display: inline-block; animation: hop 1.1s cubic-bezier(.3,.7,.4,1) infinite; transform-origin: 50% 100%; }
  .loading .shadow { width: 54px; height: 8px; margin: 2px auto 0; border-radius: 50%; background: rgba(0,0,0,.08); animation: squish 1.1s cubic-bezier(.3,.7,.4,1) infinite; }
  .loading .msg { margin-top: 12px; color: var(--muted); font-size: 17px; font-weight: 600; min-height: 1.6em; }
  .loading .dots span { display: inline-block; width: 8px; height: 8px; margin: 0 3px; border-radius: 50%; background: var(--brand); animation: blink 1.2s infinite ease-in-out; }
  .loading .dots span:nth-child(2) { animation-delay: .15s; } .loading .dots span:nth-child(3) { animation-delay: .3s; }
  .nong .m-body { fill: #fff; stroke: #21140D; stroke-width: 4.5; stroke-linejoin: round; }
  .nong .m-speed { fill: none; stroke: #FDB27A; stroke-width: 6; stroke-linecap: round; }
  .nong .m-cheek { fill: #FDB27A; }
  .nong .m-eye { fill: none; stroke: #21140D; stroke-width: 7.5; stroke-linecap: round; }
  .nong .m-line { fill: none; stroke: #21140D; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
  .nong .m-drop { fill: #8FD3F4; stroke: #21140D; stroke-width: 3; }
  .nong .m-solid { fill: #21140D; stroke: #21140D; stroke-width: 4; stroke-linejoin: round; }
  .skel { height: 64px; border-radius: var(--r); margin-bottom: 14px;
    background: linear-gradient(90deg, #ece9e2 0%, #f8f6f1 40%, #ece9e2 80%); background-size: 300% 100%; animation: shimmer 1.4s infinite linear; }
  .skel.s2 { height: 120px; } .skel.s3 { height: 88px; opacity: .7; }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1.06,.94); } 45% { transform: translateY(-22px) scale(.96,1.04) rotate(-6deg); } 60% { transform: translateY(-22px) rotate(6deg); } }
  @keyframes squish { 0%,100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.55); opacity: .5; } }
  @keyframes blink { 0%,80%,100% { transform: scale(.6); opacity: .35; } 40% { transform: scale(1); opacity: 1; } }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  .btn[disabled] .busy::after, .small-btn[disabled] .busy::after { content: '…'; display: inline-block; width: 1.2em; text-align: left; animation: blink 1.2s infinite; }
  .icon.pulse { display: inline-block; animation: hop 1.1s cubic-bezier(.3,.7,.4,1) infinite; }
  /* ---------- ปุ่ม ⋯ : ซ่อนปุ่มที่ไม่ค่อยใช้ ---------- */
  .more { display: flex; justify-content: flex-end; margin-top: 10px; }
  .more.center { justify-content: center; }
  .more-btn { min-width: 48px; min-height: 48px; padding: 0 14px; border-radius: 24px; background: #fff; border: 2px solid var(--line);
    color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 700; }
  .more-btn svg { width: 24px; height: 24px; fill: currentColor; flex: none; }
  .more-btn.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-edge); }
  .more-box { margin-top: 10px; padding: 12px; border-radius: 20px; background: #fff; border: 2px dashed #FFD0A8; animation: morein .15s ease-out; }
  .more-box > .card:last-child { margin-bottom: 0; }
  @keyframes morein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  /* ---------- ลงทะเบียน: เลือกชื่อ ---------- */
  .pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .pick button { min-height: 64px; border-radius: 20px; background: #fff; border: 2px solid var(--line); font-size: 19px; font-weight: 700; text-align: left; padding: 8px 14px; line-height: 1.25; }
  .pick button.on { border: 3px solid var(--brand); background: var(--brand-50); }
  .pick button[disabled] { opacity: .55; border-style: dashed; }
  .pick button small { display: block; font-size: 15px; font-weight: 600; color: var(--muted); }
  /* ---------- แอดมิน ---------- */
  .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
  .steps i { height: 8px; border-radius: 99px; background: #EADCCF; }
  .steps i.on { background: var(--brand); }
  .stepname { color: var(--brand-ink); font-weight: 700; font-size: 17px; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label, .field .lb { font-weight: 700; font-size: 18px; }
  .field input, .field textarea { width: 100%; }
  textarea { font: inherit; font-size: 18px; line-height: 1.6; padding: 10px 12px; border: 2px solid var(--line); border-radius: 16px; min-height: 150px; resize: vertical; }
  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .days button { min-height: 52px; border-radius: 14px; border: 2px solid #E3CDBA; background: #fff; font-family: var(--display); font-weight: 700; font-size: 18px; }
  .days button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .types button { min-height: 76px; border-radius: 20px; border: 2px solid var(--line); background: #fff; text-align: left; padding: 10px 14px; font-weight: 700; font-size: 18px; line-height: 1.25; }
  .types button small { display: block; font-weight: 600; font-size: 15px; color: var(--muted); }
  .types button.on { border: 3px solid var(--brand); background: var(--brand-50); }
  .tg { display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 2px solid var(--line); }
  .tg:last-child { border-bottom: 0; }
  .tg span { flex: 1; font-weight: 700; } .tg small { display: block; font-weight: 500; color: var(--muted); font-size: 16px; }
  .sw { appearance: none; -webkit-appearance: none; width: 64px; height: 38px; min-height: 0; padding: 0; border: 0; border-radius: 99px; background: #D8C8BB; position: relative; flex: none; }
  .sw::after { content: ''; position: absolute; top: 4px; left: 4px; width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: left .15s; }
  .sw:checked { background: var(--ok); } .sw:checked::after { left: 30px; }
  .bigcode { font-family: var(--display); font-weight: 700; font-size: 34px; letter-spacing: 3px; }
  .qr { width: 168px; height: 168px; padding: 8px; background: #fff; border: 3px solid var(--ink); border-radius: 18px; flex: none; }
  .qr img, .qr canvas { width: 100% !important; height: 100% !important; }
  .ck { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 2px solid var(--line); font-size: 18px; }
  .ck:last-child { border-bottom: 0; }
  .ck b.n { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; flex: none; font-family: var(--display); }
  .ck code { background: var(--brand-50); border-radius: 8px; padding: 1px 6px; font-weight: 700; }
  .stat3 { display: flex; gap: 8px; margin-bottom: 14px; }
  .stat3 div { flex: 1; background: var(--brand-50); border-radius: 18px; padding: 10px 12px; }
  .stat3 b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.1; }
  .stat3 span { font-size: 15px; color: var(--muted); font-weight: 600; }
  .adminbtn { min-height: 48px; padding: 6px 14px; border-radius: 16px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 700; align-self: center; }
  @media (prefers-reduced-motion: reduce) { .icon.pulse, .loading .bowl, .loading .shadow, .loading .dots span, .skel { animation: none; } }
</style>
</head>
<body>
<header>
  <span class="mark" id="mark"></span>
  <div class="who"><div class="shop" id="title">ลงเวลา</div><h1 id="who">กำลังเปิด…</h1></div>
  <div class="date" id="date" hidden></div>
  <button class="adminbtn" id="adminBtn" hidden>แอดมิน</button>
</header>
<main id="app"><div class="loading"><div class="bowl"></div><div class="shadow"></div><div class="msg">น้องพร้อมวิ่งมาแล้วน้า~</div><div class="dots"><span></span><span></span><span></span></div></div><div class="skel s2"></div><div class="skel"></div><div class="skel s3"></div></main>
<nav class="tabs" id="tabs" hidden></nav>
<div id="toast"></div>

<script>
'use strict';
// ★ วางไฟล์นี้บนเว็บอื่น (เช่น GitHub Pages): แก้แค่ API_URL บรรทัดเดียว = URL ของสคริปต์ (…/exec)
//   LIFF ID ไม่ต้องใส่ในไฟล์นี้ — หน้าเว็บถามจากเซิร์ฟเวอร์เอง (อยู่ใน Script Properties ชื่อ LIFF_ID)
//   ทุกร้านใช้ไฟล์นี้ไฟล์เดียว · ลิงก์ของแต่ละร้าน = https://liff.line.me/<LIFF_ID>?shop=<รหัสร้าน>

function shopFromUrl() {
  const clean = v => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  try {
    const q = new URLSearchParams(location.search);
    let v = q.get('shop');
    if (!v && q.get('liff.state')) v = new URLSearchParams(String(q.get('liff.state')).replace(/^[^?]*\?/, '')).get('shop');
    if (v) { localStorage.setItem('kp.shop', clean(v)); return clean(v); }
    return clean(localStorage.getItem('kp.shop'));
  } catch (e) { return ''; }
}
function rememberShop(id) { SHOP = id || ''; try { if (SHOP) localStorage.setItem('kp.shop', SHOP); else localStorage.removeItem('kp.shop'); } catch (e) {} }

boot();
async function boot() {
  if (API_URL.indexOf('__') === 0) {
    return fatal('ยังไม่ได้ใส่ API_URL ในไฟล์ index.html (ดูคู่มือติดตั้ง ขั้นที่ 9)');
  }
  if (!LIFF_ID || LIFF_ID.indexOf('__') === 0) {
    try {
      const c = await (await fetch(API_URL + '?config=1')).json();
      LIFF_ID = c.liffId || '';
    } catch (e) {
      return fatal('ติดต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจ API_URL ใน index.html และการ Deploy (คู่มือติดตั้ง ขั้นที่ 6 และ 9)');
    }
    if (!LIFF_ID) return fatal('ยังไม่ได้ใส่ LIFF_ID ใน Script Properties (คู่มือติดตั้ง ขั้นที่ 10)');
  }
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    idToken = liff.getIDToken();
    if (!idToken) return fatal('ไม่ได้รับ ID token — ต้องเปิด scope "openid" ในหน้า LIFF ของ LINE Developers');
  } catch (e) {
    return fatal('เปิด LIFF ไม่สำเร็จ: ' + e.message);
  }
  await refresh(true);
  setInterval(() => { if (tab === 'time') renderTime(); }, 15000);                  // ป้ายเงินบนปุ่มเดินตามเวลาจริง
  setInterval(() => { if (!document.hidden && !anyBusy()) refresh(); }, 60000);     // ข้อมูลสดทุก 60 วินาที
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anyBusy()) refresh(); });
}

function fatal(msg) {
  document.getElementById('app').innerHTML = `<div class="card hero"><div class="hm">${nongSvg('sad', 110)}</div><pre>${esc(msg)}</pre></div>`;
  document.getElementById('who').textContent = 'เปิดไม่สำเร็จ';
}

// ---------- คุยกับเซิร์ฟเวอร์ ----------
async function api(action, extra) {
  const body = JSON.stringify(Object.assign({ action, idToken, shop: SHOP }, extra || {}));
  const res = await fetch(API_URL + '?api=1', { method: 'POST', body });   // text/plain → ไม่ต้อง preflight
  const j = await res.json();
  if (j && j.auth) {
    if (!sessionStorage.getItem('reauth')) { sessionStorage.setItem('reauth', '1'); location.reload(); }
    throw new Error(j.error || 'ยืนยันตัวตนไม่ผ่าน');
  }
  sessionStorage.removeItem('reauth');
  return j;
}

async function refresh(first) {
  try {
    const j = await api('state');
    if (j && j.noShop) { IS_ADMIN = !!j.admin; NO_SHOP = j; S = null; if (tab !== 'admin') renderNoShop(); else renderAdmin(); return; }
    if (!j.ok) throw new Error(j.error || 'โหลดไม่สำเร็จ');
    NO_SHOP = null;
    setState(j);
  } catch (e) {
    if (first) fatal('โหลดข้อมูลไม่สำเร็จ: ' + e.message + '\nลองปิดแล้วเปิดใหม่');
    else toast('⚠️ เน็ตไม่เสถียร — ตัวเลขอาจยังไม่อัปเดต', 'warn');
  }
}

function setState(j) {
  S = j;
  IS_ADMIN = !!j.admin;
  if (j.shopId && j.shopId !== SHOP) rememberShop(j.shopId);
  skew = j.now - Date.now();
  render();
}

/**
 * ทำงาน 1 ปุ่ม: เปลี่ยนหน้าจอก่อน แล้วบันทึกเบื้องหลัง
 * rid = รหัสการกดครั้งนี้ · ส่งซ้ำ (เน็ตหลุด/กดใหม่) ใช้ rid เดิม → เซิร์ฟเวอร์บันทึกครั้งเดียว
 */
async function act(action, extra, optimistic) {
  if (busy[action]) return null;
  const rid = pendingRid(action);
  busy[action] = true;
  const before = S ? JSON.parse(JSON.stringify(S)) : null;
  if (optimistic && S) { optimistic(S); render(); }
  let res = null, lastErr = null;
  for (let i = 0; i < 3 && !res; i++) {
    try { res = await api(action, Object.assign({ rid }, extra || {})); }
    catch (e) { lastErr = e; await sleep(1000 * (i + 1) * (i + 1)); }
  }
  busy[action] = false;
  if (!res) {
    if (before) S = before;
    render();
    toast('📶 ' + nong('offline') + '\nกดปุ่มเดิมอีกครั้งได้เลย ระบบจะไม่บันทึกซ้ำ\n(' + (lastErr ? lastErr.message : '') + ')', 'bad', 9000);
    return null;
  }
  clearPending(action);
  if (res.ok && action !== 'setSetting' && action !== 'setRole') moreOpen = '';
  if (res.state && res.state.ok) setState(res.state); else render();
  if (res.text) toast(res.text + '\n' + (res.ok ? nong('ok') : nong('error')), res.ok ? 'ok' : 'bad', res.ok ? 6000 : 9000);
  else if (res.error) toast(res.error, 'bad', 9000);
  if (res.ok && res.share) shareToGroup(res.share);
  return res;
}

function pendingRid(action) {
  const k = 'rid:' + action;
  try {
    const p = JSON.parse(localStorage.getItem(k) || 'null');
    if (p && Date.now() - p.at < 10 * 60000) return p.rid;
  } catch (e) {}
  const rid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^\w-]/g, '');
  try { localStorage.setItem(k, JSON.stringify({ rid, at: Date.now() })); } catch (e) {}
  return rid;
}
function clearPending(action) { try { localStorage.removeItem('rid:' + action); } catch (e) {} }
function anyBusy() { return Object.keys(busy).some(k => busy[k]); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- ตัวช่วย ----------
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function nowMs() { return Date.now() + skew; }
function hhmm(ms) {
  return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(ms));
}
function baht(n) { return Number(n || 0).toLocaleString('th-TH'); }

/** สูตรเดียวกับเซิร์ฟเวอร์ (otRounds) — ใช้แสดงผลเท่านั้น ตัวเลขจริงคิดที่เซิร์ฟเวอร์ตอนกด */
function otView(t) {
  const o = S.ot, over = Math.floor((t - o.std) / 60000);
  const rounds = over < o.first ? 0 : 1 + Math.floor((over - o.first) / o.step);
  const nextAt = o.std + (rounds === 0 ? o.first : o.first + rounds * o.step) * 60000;
  return { over, rounds, money: rounds * o.rate, beforeStd: t < o.std,
           waitMin: Math.ceil((nextAt - t) / 60000), warn: over >= o.first && S.staying.length > o.keep };
}

function toast(text, kind, ms) {
  const el = document.getElementById('toast');
  el.className = kind || '';
  el.innerHTML = `<pre>${esc(text)}</pre>`;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, ms || 6000);
  el.onclick = () => { el.style.display = 'none'; };
}

/** ปุ่มอันตราย: แตะครั้งแรก = ขอยืนยัน · แตะครั้งที่สองภายใน 6 วินาที = ทำจริง (ห้ามใช้ confirm()) */
function twoTap(id, fn) {
  if (armed === id) { armed = ''; clearTimeout(armTimer); fn(); return; }
  armed = id;
  clearTimeout(armTimer);
  armTimer = setTimeout(() => { armed = ''; render(); }, 6000);
  render();
}

/**
 * ปุ่ม ⋯ — ปุ่มที่นานๆ ใช้ที ซ่อนไว้ แตะ ⋯ ก่อนถึงจะเห็น · เปิดได้ทีละอัน
 * แตะซ้ำ = ปิด · เปลี่ยนหน้า = ปิด · ทำรายการในแผงสำเร็จ = ปิด

let moreOpen = '', moreView = '';
function moreBtn(id, label) {

  return `<button class="more-btn${on ? ' on' : ''}" data-more="${esc(id)}" aria-label="ตัวเลือกเพิ่มเติม" aria-expanded="${on}">${label ? esc(on ? 'ปิด' : label) : ''}
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg></button>`;
}
function moreBox(id, html) { return moreOpen === id && html ? `<div class="more-box">${html}</div>` : ''; }
/** เปลี่ยนหน้าแล้วปิดแผง ⋯ ที่ค้างไว้ */
function moreReset(view) { if (view !== moreView) { moreView = view; moreOpen = ''; } }
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-more]');
  if (!b) return;
  moreOpen = moreOpen === b.dataset.more ? '' : b.dataset.more;
  armed = '';
  if (tab === 'admin') renderAdmin(); else if (tab === 'boss' && S) renderBoss(); else render();
});

// ---------- แจ้งในกลุ่ม (liff.sendMessages — ส่งในนามพนักงาน ไม่ใช่ push ของบอท) ----------
let pendingShare = '';
try { pendingShare = localStorage.getItem('pendingShare') || ''; } catch (e) {}
function setPendingShare(t) { pendingShare = t || ''; try { localStorage.setItem('pendingShare', pendingShare); } catch (e) {} }
function inGroup() {
  try { const c = liff.getContext(); return !!c && (c.type === 'group' || c.type === 'room'); } catch (e) { return false; }
}
/** บันทึกลงชีตเสร็จก่อนเสมอ แล้วค่อยส่ง · ส่งพลาด → เก็บไว้ให้กด "ส่งแจ้งอีกครั้ง" (เวลาที่บันทึกไม่หาย) */
async function shareToGroup(text) {
  if (!text || !inGroup()) return;
  try {
    if (!liff.isApiAvailable('sendMessages')) throw new Error('ส่งข้อความจากหน้านี้ไม่ได้');
    await liff.sendMessages([{ type: 'text', text: text.slice(0, 4900) }]);
    setPendingShare('');
  } catch (e) {
    setPendingShare(text);
    toast('📣 บันทึกเวลาแล้ว แต่ส่งแจ้งในกลุ่มไม่สำเร็จ\nกด "ส่งแจ้งอีกครั้ง" ได้เลย', 'warn', 8000);
  }
  render();
}

  b.onclick = () => {

function renderTime() {
  if (!S || !S.registered || tab !== 'time') return;
  const app = document.getElementById('app');
  const t = nowMs(), d = S.today, ot = S.ot;
  const clock = `<div class="clock">${hhmm(t)}</div>`;
  const checkedIn = d && d.status === ST_WORK && d.in;
  const out = checkedIn && (d.out || d.early);
  const offStatus = d && d.status && d.status !== ST_WORK;
  const showOt = S.perPerson && S.me.ot;
  const v = otView(t);
  const lateLine = checkedIn && (d.late || d.fine) ? `<div class="note warn">สาย ${d.late} นาที · หัก ${baht(d.fine)} บาท</div>` : '';
  let html = '';

  if (pendingShare) {
    html += `<div class="card"><div class="note warn" style="margin-top:0">📣 ยังไม่ได้แจ้งในกลุ่ม<br><span style="font-size:15px">${esc(pendingShare.split('\n')[0])}</span></div>
      <div class="gap" style="height:10px"></div><button class="small-btn" id="bShare" style="width:100%">📣 ส่งแจ้งอีกครั้ง</button></div>`;
  }

  // 1) สถานะ
  if (busy.checkin) html += hero(clock, 'กำลังหาตำแหน่ง…', 'warn', '<div class="muted" style="margin-top:8px">ถือมือถือนิ่งๆ สักครู่น้า~</div>', 'search');
  else if (S.day.closedDay) html += hero('<div class="result">พักให้เต็มที่นะ</div>', 'วันนี้ร้านหยุด', '', '', 'sleepy');
  else if (offStatus) html += hero(clock, 'บันทึกว่า ' + esc(d.status), 'bad', '<div class="muted" style="margin-top:8px">ถ้าผิด แจ้งผู้จัดการ</div>');
  else if (!checkedIn) html += hero(clock, S.day.works ? 'ยังไม่เข้างาน' : 'วันนี้ไม่ใช่วันทำงานของคุณ');
  else if (!out) html += hero(clock, 'ทำงานอยู่ · เข้า ' + esc(d.in), d.late ? 'warn' : 'ok', lateLine);
  else if (d.early) html += hero(clock, 'กลับก่อน ' + esc(d.early), '', '<div class="result">ไม่มี OT คืนนี้<small>ไม่หักค่าแรง</small></div>' + lateLine);
  else html += hero(clock, (busy.checkout ? 'กำลังบันทึก… ' : 'เลิกงานแล้ว ') + esc(d.out), '',
    '<div class="muted" style="margin-top:6px">เหนื่อยหน่อยนะวันนี้ พักผ่อนเยอะๆ</div>' + (showOt && !busy.checkout ? `<div class="result">${d.rounds ? `OT ${baht(d.rounds * ot.rate)} บาท<small>${d.rounds} รอบ</small>` : 'ไม่มี OT<small>ยังไม่ถึงรอบ</small>'}</div>` : '') + lateLine, 'sleepy');

  // 2) ปุ่มหลัก (ทีละปุ่ม)
  if (!S.day.closedDay && !offStatus) {
    if (!checkedIn && !busy.checkin) {
      html += `<button class="btn green" id="bIn">เข้างาน<small>กดตอนอยู่ที่ร้าน</small></button>`;
    } else if (checkedIn && !out) {
      if (showOt && v.beforeStd) {
        // ก่อนเวลาปิดมาตรฐาน = กลับก่อน (ไม่ได้ OT ทั้งคืน)
        const lbl = armed === 'early' ? 'แตะอีกครั้ง ยืนยัน' : 'กลับก่อน';
        html += `<button class="btn orange${armed === 'early' ? ' confirm' : ''}" id="bEarly">${lbl}<small>ก่อน ${ot.stdHm} · คืนนี้ไม่ได้ OT</small></button>`;
        html += `<span class="hint">⏳ อยู่ถึง ${hhmm(ot.std + ot.first * 60000)} ได้ OT ${baht(ot.rate)} บ.</span>`;
      } else {
        let sub = 'บันทึกเวลาออก';
        if (showOt) sub = v.rounds === 0 ? 'ยังไม่ถึงรอบ OT' : `ได้ OT ${v.rounds} รอบ · ${baht(v.money)} บาท`;
        const lbl = armed === 'out' ? 'แตะอีกครั้ง ยืนยัน' : 'เลิกงาน';
        html += `<button class="btn${armed === 'out' ? ' confirm' : ''}" id="bOut">${lbl}<small>${esc(sub)}</small></button>`;
        if (showOt && !S.closed) {
          html += `<span class="hint">⏳ รออีก ${v.waitMin} นาที ${v.rounds === 0 ? 'ได้ OT' : 'ได้เพิ่ม'} ${baht(ot.rate)} บ.</span>`;
        }
      }
    }
    if (!inGroup() && !checkedIn) html += '<div class="muted center" style="margin-top:10px">💡 เปิดหน้านี้จากในกลุ่มร้าน คนอื่นจะเห็นตอนคุณลงเวลา</div>';
  }

  // 3) ใครยังอยู่ที่ร้าน
  if (checkedIn || t >= ot.std) {
    html += '<div class="gap"></div>';
    if (S.closed) {
      html += `<div class="card"><div class="row"><span style="font-size:26px">🌙</span><div><b>ปิดร้านแล้ว ${esc(S.closed.hm)}</b><div class="muted">โดย ${esc(S.closed.by)}</div></div></div></div>`;
    } else {
      const chips = S.staying.map(n => `<span class="chip">${esc(n)}</span>`).join('') +
                    S.stayingOther.map(n => `<span class="chip grey">${esc(n)} · ครัว</span>`).join('');
      html += `<div class="card"><h2>ยังอยู่ที่ร้าน ${S.staying.length} คน</h2>
        ${chips ? `<div class="chips">${chips}</div>` : '<div class="muted">กลับหมดแล้ว</div>'}
        ${showOt && v.warn ? `<div class="note warn">⚠️ ตอนนี้อยู่ ${S.staying.length} คน · ร้านตั้งไว้ว่าหลังรอบแรกให้เหลือ ${ot.keep} คน<br>ตกลงกันเองว่าใครอยู่ต่อ</div>` : ''}</div>`;
    }
  }

  // 4) ปิดร้าน — คืนละครั้ง: ยังมีคนอยู่ = ปุ่มเล็ก · ไม่เหลือใครแล้ว = ปุ่มใหญ่ (ไม่ซ่อนใน ⋯ กันคนสุดท้ายหาไม่เจอ)
  if (t >= ot.std && !S.closed && !S.day.closedDay) {
    const lbl = busy.close ? '<span class="busy">กำลังปิดร้าน</span>' : armed === 'close' ? `แตะอีกครั้ง ปิดร้าน ${hhmm(t)}` : '🌙 ปิดร้าน';
    const alone = !S.staying.length && !S.stayingOther.length;
    html += alone || armed === 'close'
      ? `<button class="btn quiet${armed === 'close' ? ' confirm' : ''}" id="bClose" ${busy.close ? 'disabled' : ''}>${lbl}<small>คนสุดท้ายกด</small></button>`
      : `<div class="center"><button class="small-btn ghost" id="bClose" ${busy.close ? 'disabled' : ''}>${lbl} · คนสุดท้ายกด</button></div>`;
  }
  app.innerHTML = html;

  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('bIn', checkIn);
  on('bShare', () => shareToGroup(pendingShare));
  on('bOut', () => twoTap('out', () => {
    const at = hhmm(nowMs());
    act('checkout', {}, s => { s.today.out = at; s.staying = s.staying.filter(n => n !== s.me.name); });
  }));
  on('bEarly', () => twoTap('early', () => {
    const at = hhmm(nowMs());
    act('early', {}, s => { s.today.early = at; s.today.out = at; s.staying = s.staying.filter(n => n !== s.me.name); });
  }));
  on('bClose', () => twoTap('close', () => doClose()));
}

async function doClose(time) {
  const at = time || hhmm(nowMs());
  return act('close', time ? { time } : {}, s => { s.closed = { hm: at, by: s.me.name }; });
}

// ---------- เช็คอิน GPS ----------
async function checkIn() {
  if (busy.checkin) return;
  busy.checkin = true; render();
  let pos;
  try { pos = await getBestPosition(); }
  catch (e) { busy.checkin = false; render(); return toast('❌ ' + e.message, 'bad', 9000); }
  busy.checkin = false;
  const c = pos.coords;
  act('checkin', { lat: c.latitude, lng: c.longitude, acc: Math.round(c.accuracy) },
      s => { s.today = { status: ST_WORK, in: hhmm(nowMs()), out: '', early: '', rounds: 0 }; });
}

/** เก็บตำแหน่งหลายครั้งภายใน ~10 วินาที เลือกค่าที่แม่นที่สุด (GPS ครั้งแรกมักคลาดเยอะ) */
function getBestPosition(maxMs, goodAcc) {
  maxMs = maxMs || 10000; goodAcc = goodAcc || 25;
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('เครื่องนี้ใช้ GPS ไม่ได้ — ใช้วิธีแชร์ตำแหน่งในแชทแทน'));
    let best = null, done = false, id = null;
    const finish = err => {
      if (done) return; done = true;
      if (id !== null) navigator.geolocation.clearWatch(id);
      clearTimeout(timer);
      if (best) resolve(best);
      else reject(err || new Error('หาตำแหน่งไม่เจอ ลองออกไปที่โล่งแล้วกดใหม่'));
    };
    const timer = setTimeout(() => finish(), maxMs);
    id = navigator.geolocation.watchPosition(p => {
      if (!best || p.coords.accuracy < best.coords.accuracy) best = p;
      if (p.coords.accuracy <= goodAcc) finish();
    }, err => {
      if (err.code === 1) finish(new Error('ยังไม่อนุญาตให้ LINE ใช้ตำแหน่ง — เปิดสิทธิ์ตำแหน่งในการตั้งค่ามือถือ แล้วกดใหม่'));
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: maxMs });
  });
}

// ---------- ขอลา / ขอเข้าสาย — ปฏิทินเดียว 3 โหมด (สเปค 4.4) ----------
let leaveSel = [];
function calCell(c) {
  // สถานะใบลาเดิมของวันนั้น (ทุกประเภท)
  const st = (c.my || []).filter(x => x.status !== 'ปฏิเสธ');
  const rej = (c.my || []).some(x => x.status === 'ปฏิเสธ');
  const hasLeave = st.some(x => x.type !== 'ขอเข้าสาย'), hasPass = st.some(x => x.type === 'ขอเข้าสาย');
  let cls = '', tag = '';
  if (st.some(x => x.status === 'อนุมัติ')) cls = 'appr'; else if (st.length) cls = 'pend'; else if (rej) cls = 'rej';
  const isPass = leaveType === 'ขอเข้าสาย';
  const units = leaveType === 'ลาป่วย' ? c.sick : c.kij;
  // ลา: ย้อนหลังได้ (ฉุกเฉิน) แต่ไม่ใช่วันที่เข้างานแล้ว · ขอเข้าสาย: วันนี้ได้ถ้ายังไม่เข้างาน ย้อนหลังไม่ได้
  const shut = c.off || (isPass ? (c.ahead < 0 || (c.ahead === 0 && c.came) || hasPass)
                                : (hasLeave || (c.ahead <= 0 && (c.came || c.absent))));
  if (!c.off && !st.length) tag = isPass ? '' : (units ? `−${units}` : '0');
  if (st.length) tag = st[0].type === 'ขอเข้าสาย' ? 'สาย' : st[0].type.replace('ลา', '');
  if (leaveSel.indexOf(c.k) >= 0) cls = 'on';
  return `<button data-k="${c.k}" class="${cls}" ${shut ? 'disabled' : ''}>${+c.k.slice(8)}${tag ? `<i>${esc(tag)}</i>` : ''}</button>`;
}

function renderLeave() {
  const app = document.getElementById('app');
  const cal = S.cal || [], lc = S.leaveCfg || {}, wage = S.me.wage || 0;
  let grid = '', lastMon = -1;
  cal.forEach(function (c) {

      lastMon = mo;
      grid += `<div class="mon">${MON_FULL[mo]} ${+c.k.slice(0, 4) + 543}</div>` + DOW.map(x => `<div class="dow">${x}</div>`).join('');
      for (let k = 0; k < c.dow; k++) grid += '<span></span>';
    }
    grid += calCell(c);
  });
  const isPass = leaveType === 'ขอเข้าสาย';
  const picked = cal.filter(c => leaveSel.indexOf(c.k) >= 0);
  let sum = '';
  if (picked.length) {
    let units = 0;
    const lines = picked.map(c => {
      const u = leaveType === 'ลาป่วย' ? c.sick : c.kij;

        <div class="amt">${u ? `หัก ${u} แรง` : 'ไม่หัก'}</div></div>`;
    }).join('');
    const total = isPass ? `รวมค่าธรรมเนียม ${baht(lc.fee * picked.length)} บาท`
                         : units ? `รวมหัก ${units} แรง ≈ ${baht(units * wage)} บาท` : 'ไม่หักแรง';
    sum = `<div class="card"><h2>เลือก ${picked.length} วัน</h2><div class="list">${lines}</div>
      <div class="total"><span>${total}</span></div>
      ${isPass ? `<div class="muted" style="margin-top:6px">เข้าได้ถึง ${esc(lc.until)} น. · ไม่โดนปรับนาที</div>` : ''}</div>`;
  }
  const lvPill = l => l.status === 'ปฏิเสธ' ? ['bad', 'ไม่อนุมัติ'] : l.status === 'รออนุมัติ' ? ['warn', 'รออนุมัติ'] :
                     l.checked ? ['blue', 'ผู้จัดการยืนยัน'] : ['blue', 'ระบบนับแล้ว'];
  const mine = (S.myLeaves || []).map(l => {
    const can = l.status !== 'ปฏิเสธ' && !l.checked, mid = 'lv' + l.id;
    return `<div class="item" style="flex-wrap:wrap"><div class="main"><div class="name">${esc(l.type)}</div>
      <div class="sub">${+l.date.slice(8)} ${MON[+l.date.slice(5, 7) - 1]}${l.units ? ` · หัก ${l.units} แรง` : ''}</div></div>
      <span class="pill ${lvPill(l)[0]}">${lvPill(l)[1]}</span>${can ? moreBtn(mid) : ''}
      ${can ? `<div style="width:100%">${moreBox(mid, `<button class="small-btn red" data-cancel="${esc(l.id)}" style="width:100%;min-height:56px">${armed === 'cancel' + l.id ? 'แตะอีกครั้ง ยืนยันยกเลิกใบลา' : 'ยกเลิกใบลานี้'}</button>`)}</div>` : ''}</div>`;
  }).join('');
  const backTxt = lc.back ? ` · ฉุกเฉินลาย้อนหลังได้ ${lc.back} วัน` : '';
  const hint = isPass ? `ค่าธรรมเนียม ${baht(lc.fee)} บาท/วัน · ขอวันนี้ได้ถ้ายังไม่กดเข้างาน` :
               (leaveType === 'ลาป่วย' && !lc.sickDeduct ? 'ลาป่วยไม่หักแรง' : 'ตัวเลขใต้วัน = แรงที่หัก (อังคาร ศุกร์ เสาร์ หักหนักกว่า)') + backTxt;
  app.innerHTML = `
    <div class="seg">${[['ลากิจ', 'ลากิจ'], ['ลาป่วย', 'ลาป่วย'], ['ขอเข้าสาย', 'เข้าสาย']].map(x =>
      `<button data-t="${x[0]}" class="${leaveType === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}</div>
    <div class="card"><div class="muted" style="margin-bottom:8px">${hint}</div><div class="cal">${grid}</div>
      <div class="legend"><span><i class="dot on"></i>เลือกอยู่</span>
        <span><i class="dot appr"></i>ลาแล้ว</span><span><i class="dot rej"></i>ไม่อนุมัติ</span></div></div>
    ${sum}
    <button class="btn" id="lvGo" ${picked.length && !busy.leave ? '' : 'disabled'}>${busy.leave ? '<span class="busy">กำลังส่ง</span>' :
      picked.length ? `ส่ง${isPass ? 'ขอเข้าสาย' : 'ใบลา'} ${picked.length} วัน` : 'แตะวันในปฏิทินก่อน'}<small>ระบบนับให้ทันที · ผู้จัดการตรวจตอนปิดงวด</small></button>
    ${mine ? `<div class="gap"></div><div class="card"><h2>ใบลาของฉัน</h2><div class="list">${mine}</div></div>` : ''}`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { leaveType = b.dataset.t; leaveSel = []; render(); });
  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k, i = leaveSel.indexOf(k);
    if (i >= 0) leaveSel.splice(i, 1); else if (leaveSel.length < 14) leaveSel.push(k);
    render();
  });
  app.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => twoTap('cancel' + b.dataset.cancel, () => act('cancelLeave', { id: b.dataset.cancel })));
  document.getElementById('lvGo').onclick = async () => {
    const r = await act('leave', { type: leaveType, dates: leaveSel.slice().sort() });
    if (r && r.ok) leaveSel = [];
    render();
  };
}

// ---------- ของฉัน ----------
let myText = '';
async function loadMy() {
  try { const r = await api('my'); myText = r.ok ? r.text : (r.error || ''); }
  catch (e) { myText = '📶 โหลดไม่สำเร็จ ลองใหม่'; }
  if (tab === 'my') renderMy();
}
function renderMy() {
  // แปลงสลิปข้อความ ("OT 1 รอบ  →  +50") เป็นรายการอ่านง่าย
  const lines = String(myText || '').split('\n');
  const rows = [], notes = [], edits = [];
  let total = '';
  lines.forEach(l => {
    const t = l.trim();
    if (t.indexOf('📝') === 0) { edits.push(t.replace(/^📝\s*/, '')); return; }
    const m = l.match(/^\s+(.+?)\s+→\s+([+-]?[\d,]+)\s*$/);
    if (!m) { if (t && !/^\S+ · [\d,]+\/วัน$/.test(t)) notes.push(t); return; }
    if (m[1].trim() === 'รวม') total = m[2]; else rows.push([m[1].trim(), m[2]]);
  });
  let html;
  if (!myText) html = loadingHtml();
  else if (!rows.length) html = `<div class="card"><pre>${esc(myText)}</pre></div>`;
  else {
    const head = notes.shift() || '';
    html = `<div class="card hero"><div class="muted">${esc(head.replace(/^📊\s*/, ''))}</div>
        <div class="clock" style="font-size:52px;margin-top:6px">${esc(total)}<span style="font-size:22px"> บาท</span></div>
        <div><span class="status">ยอดถึงตอนนี้</span></div></div>
      <div class="card"><div class="list">${rows.map(r => `<div class="item"><div class="main">${esc(r[0])}</div>
        <div class="amt" style="color:${r[1].charAt(0) === '-' ? 'var(--bad)' : 'var(--ink)'}">${esc(r[1])}</div></div>`).join('')}</div></div>
      ${edits.length ? `<div class="card"><h2>📝 มีการแก้ข้อมูลของคุณ</h2>${edits.map(x => `<div class="muted">• ${esc(x)}</div>`).join('')}</div>` : ''}
      ${notes.filter(n => n.indexOf('※') === 0).map(n => `<div class="muted center">${esc(n)}</div>`).join('')}`;
  }
  document.getElementById('app').innerHTML = html + (myText ? `<div class="more center">${moreBtn('my', 'เพิ่มเติม')}</div>` +
    moreBox('my', '<button class="btn quiet" id="myR" style="margin:0">โหลดใหม่<small>ดึงยอดล่าสุดอีกครั้ง</small></button>') : '');
  const mr = document.getElementById('myR');
  if (mr) mr.onclick = () => { moreOpen = ''; myText = ''; renderMy(); loadMy(); };
}

let auditData = null, auditPeriod = 0;
async function loadAudit() {
  try { auditData = await api('audit', { period: auditPeriod }); } catch (e) { auditData = { ok: false, error: '📶 โหลดไม่สำเร็จ' }; }
  if (tab === 'audit') renderAudit();
}
function auditItem(a) {
  return `<div class="item" style="display:block${a.self ? ';background:var(--warn-soft);margin:0 -12px;padding:12px' : ''}">
    <div class="sub">${esc(a.day)} · แก้เมื่อ ${esc(a.at.slice(8, 10))}/${+a.at.slice(5, 7)} ${esc(a.at.slice(11))} · <b>${esc(a.editor)}</b>
      ${a.self ? '<span class="pill bad">⚠️ แก้ของตัวเอง</span>' : ''}</div>
    <div class="name" style="font-weight:600">${esc(a.what)}${a.self ? '' : ` ของ ${esc(a.owner)}`}</div>
    <div class="num">${esc(a.from)} → ${esc(a.to)}</div>
    ${a.reason ? `<div class="muted">"${esc(a.reason)}"</div>` : '<div class="muted">(ไม่ใส่เหตุผล)</div>'}</div>`;
}
function renderAudit() {
  const r = auditData;
  let body;
  if (!r) body = loadingHtml();
  else if (!r.ok) body = `<div class="card"><div class="note bad">${esc(r.error)}</div></div>`;
  else if (!r.items.length) body = `<div class="card hero"><div class="hm">${nongSvg('wink', 110)}</div><h2 style="margin:0">งวดนี้ไม่มีใครแก้อะไร</h2><div class="muted">งวด ${esc(r.code)} · ถ้ามีการแก้ จะขึ้นที่นี่พร้อมเหตุผล</div></div>`;
  else body = `<div class="card"><h2>📝 ประวัติการแก้ไข · งวด ${esc(r.code)}</h2><div class="muted">ผู้จัดการแก้อะไร ทุกคนเห็นเหมือนกัน</div>
    <div class="list">${r.items.map(auditItem).join('')}</div></div>`;
  const other = auditPeriod === 0 ? -1 : 0;
  document.getElementById('app').innerHTML =
    `<div class="row" style="justify-content:space-between;flex-wrap:nowrap;margin-bottom:10px"><h2 style="margin:0;font-family:var(--display)">${auditPeriod === 0 ? 'งวดนี้' : 'งวดก่อน'}</h2>${moreBtn('audit')}</div>` +
    moreBox('audit', `<button class="btn quiet" data-p="${other}" style="margin:0">ดู${other === -1 ? 'งวดก่อน' : 'งวดนี้'}</button>`) + body;
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { moreOpen = ''; auditPeriod = +b.dataset.p; auditData = null; renderAudit(); loadAudit(); });
}

let bossDate = '', bossOpen = '', mgReason = '';
async function loadBoss() {
  const k = bossTab;
  try {
    let r;
    if (k === 'today') r = await api('bossToday', { date: bossDate });
    else if (k === 'leaves') r = await api('bossLeaves');
    else if (k === 'pay') r = await api('payPreview');
    else r = await api('ownerSettings');
    bossCache[k] = r;
  } catch (e) { bossCache[k] = { ok: false, error: '📶 โหลดไม่สำเร็จ' }; }
  if (tab === 'boss' && bossTab === k) renderBoss();
}

function renderBoss() {
  moreReset(tab + '/' + bossTab + '/' + bossOpen);
  const subs = [['today', 'วันนี้'], ['leaves', 'ใบลา'], ['pay', 'จ่ายเงิน']];
  if (S.me.owner) subs.push(['set', 'ตั้งค่า']);
  const r = bossCache[bossTab];
  let body = '';
  if (!r) body = loadingHtml();
  else if (!r.ok) body = `<div class="card"><div class="note bad">${esc(r.error || 'ผิดพลาด')}</div></div>`;
  else if (bossTab === 'today') body = bossTodayHtml(r);
  else if (bossTab === 'leaves') body = bossLeavesHtml(r);
  else if (bossTab === 'pay') body = bossPayHtml(r);
  else body = bossSetHtml(r);
  const app = document.getElementById('app');
  app.innerHTML = `<div class="seg">${subs.map(s => `<button data-s="${s[0]}" class="${bossTab === s[0] ? 'on' : ''}">${s[1]}</button>`).join('')}</div>` + body;
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { bossTab = b.dataset.s; renderBoss(); loadBoss(); });
  wireBoss(app);
}

function manageBox(x, r) {
  const self = x.name === S.me.name, work = x.status === ST_WORK;
  const row = (label, ctl, kind) => `<div class="row mrow"><span class="mlabel">${label}</span>${ctl}
    <button class="small-btn" data-m="${kind}">บันทึก</button></div>`;
  let h = `<div class="mbox">
    <input id="mReason" value="${esc(mgReason)}" placeholder="${self ? 'เหตุผล (ต้องใส่ — แก้ของตัวเอง)' : 'เหตุผล (ไม่บังคับ)'}" style="width:100%">`;
  let rare = '';   // นานๆ ใช้ที → ซ่อนใน ⋯ เพิ่มเติม
  if (self) h += '<div class="note warn">⚠️ นี่คือข้อมูลของคุณเอง — ทุกคนจะเห็นว่าแก้ของตัวเอง</div>';
  if (work) {
    h += row('แก้เวลาเข้า', `<input type="time" id="mIn" value="${esc(x.in || '16:00')}">`, 'editIn');
    h += row('แก้เวลาออก', `<input type="time" id="mOut" value="${esc(x.out || '02:00')}">`, 'editOut');
    if (!x.pass) h += row(`ให้เข้าสาย <span class="muted">(คิดถึง ${esc((S.leaveCfg || {}).until || '18:00')} · ${baht((S.leaveCfg || {}).fee || 0)} บ.)</span>`, '', 'latePass');
    if (x.late || x.fine) h += row(`ยกเว้นสาย <span class="muted">(${x.late} นาที · ${baht(x.fine)} บ.)</span>`, '', 'excuse');
    rare += row('ปรับค่าปรับเอง (บาท)', `<input type="number" id="mBaht" min="0" value="${x.fine}" style="width:90px">`, 'fine');
  }
  if (!work && x.status === 'ยังไม่มา' && !x.pass) h += row('ให้เข้าสาย (ยังไม่มา)', '', 'latePass');
  if (x.status !== 'ขาดงาน') rare += row('ลงว่าขาด', `<select id="mUnits">${[1, 2, 3, 4, 5].map(n => `<option value="${n}">${n} แรง</option>`).join('')}</select>`, 'absent');
  else h += row('ยกเลิกขาด', '', 'undoAbsent');
  if (r.foodOn && x.status !== 'ยังไม่มา') rare += x.noFood ? row('คืนค่าอาหาร', '', 'food') : row('ไม่ได้ค่าอาหาร', '', 'noFood');
  if (!self) rare += `<div class="row mrow"><span class="mlabel">ปลดเครื่อง <span class="muted">(เปลี่ยนมือถือ · ให้เลือกชื่อใหม่)</span></span>
    <button class="small-btn red" data-unbind="${esc(x.name)}">${armed === 'unbind' + x.name ? 'แตะอีกครั้ง' : 'ปลด'}</button></div>`;
  if (rare) h += `<div class="more">${moreBtn('mg', 'เพิ่มเติม')}</div>${moreBox('mg', rare)}`;
  return h + '</div>';
}

function bossTodayHtml(r) {
  const items = r.rows.map(x => {
    const tag = x.status !== ST_WORK ? `<span class="pill ${x.status === 'ยังไม่มา' ? '' : 'bad'}">${esc(x.status)}</span>` :
                x.early ? '<span class="pill warn">กลับก่อน</span>' : !x.ot ? '<span class="pill">ครัว</span>' : '';
    const late = x.late || x.fine ? ` · <span style="color:var(--bad)">สาย ${x.late} น. −${baht(x.fine)}</span>` : '';
    const amt = x.ot && x.status === ST_WORK ? `${baht(x.money)}<small>OT ${x.rounds} รอบ</small>` : '<small>–</small>';
    return `<div class="item" style="flex-wrap:wrap"><div class="main"><div class="name">${esc(x.name)} ${tag}</div>
      <div class="sub num">${esc(x.in || '–')} → ${esc(x.out || (x.status === ST_WORK ? 'ยังอยู่' : '–'))}${late}</div></div>
      <div class="amt">${amt}</div>
      ${r.locked ? '' : `<button class="small-btn ghost" data-open="${esc(x.name)}">${bossOpen === x.name ? 'ปิด' : 'จัดการ'}</button>`}
      ${bossOpen === x.name ? `<div style="width:100%">${manageBox(x, r)}</div>` : ''}</div>`;
  }).join('');
  const extra = `<div class="field" style="margin:0 0 12px"><label for="bdDate">ดูวันอื่น</label><input type="date" id="bdDate" value="${esc(r.key)}"></div>` +
    (r.locked ? '' : `<div class="field" style="margin:0"><span class="lb">🌙 ${r.closed ? 'แก้เวลาปิดร้าน' : 'บันทึกปิดร้านแทน'}</span>
      <div class="muted" style="font-size:16px">คนที่กดเลิกงานเองไม่ถูกเปลี่ยน</div>
      <div class="row"><input type="time" id="rcTime" value="${esc(r.closed ? r.closed.hm : '02:00')}" style="flex:1">
      <button class="small-btn" id="rcGo">${armed === 'reclose' ? 'แตะอีกครั้ง' : 'บันทึก'}</button></div></div>`);
  return `
    <div class="card"><div class="row" style="flex-wrap:nowrap"><div style="flex:1;min-width:0"><h2 style="margin:0">${esc(r.label)}</h2>
      <div class="muted">${r.closed ? `🌙 ปิดร้าน ${esc(r.closed.hm)} · โดย ${esc(r.closed.by)}` : 'ยังไม่บันทึกปิดร้าน'}</div>
      ${r.locked ? '<span class="pill bad">งวดปิดแล้ว แก้ไม่ได้</span>' : ''}</div>${moreBtn('bt')}</div>
      ${moreBox('bt', extra)}</div>
    <div class="card">
      ${items ? `<div class="list">${items}</div><div class="total"><span>OT คืนนี้</span><span class="num">${baht(r.totalOt)} บาท</span></div>` : '<div class="muted">ไม่มีใครต้องทำงานวันนี้</div>'}</div>`;
}

function bossLeavesHtml(r) {
  if (!r.items.length) return `<div class="card hero"><div class="hm">${nongSvg('happy', 110)}</div><h2 style="margin:0">ยังไม่มีใบลาเลย สบายๆ~</h2></div>`;
  const head = r.todo ? `<div class="card"><div class="note warn" style="margin-top:0">ติ๊กให้ครบก่อนปิดงวด · เหลือ ${r.todo} ใบ<br>
      <span style="font-size:15px">ระบบนับแรงให้แล้ว แค่ดูว่าถูกไหม · ไม่ถูก กด "ไม่อนุมัติ" (วันที่ผ่านไปแล้วจะกลายเป็นขาดงาน)</span></div></div>`
    : '<div class="card"><div class="note ok" style="margin-top:0">✔️ ติ๊กครบทุกใบแล้ว</div></div>';
  return head + r.items.map(x => {
    const self = x.name === S.me.name, rej = x.status === 'ปฏิเสธ';
    const pill = rej ? '<span class="pill bad">ไม่อนุมัติ</span>' : x.todo ? '<span class="pill warn">รอติ๊ก</span>' : '<span class="pill blue">✔️ ยืนยันแล้ว</span>';
    const adj = !(x.type === 'ขอเข้าสาย' || rej), mid = 'lu' + x.id;

      <div class="muted">${esc(x.day)} · ${esc(x.mode)}${x.units ? ` · หัก ${x.units} แรง` : ''} · ${esc(x.id)}</div>
      ${x.back ? '<span class="pill warn">⚠️ ลาย้อนหลัง</span>' : ''}${x.by && !x.todo ? `<div class="muted" style="font-size:14px">โดย ${esc(x.by)}</div>` : ''}</div>${pill}${adj ? moreBtn(mid) : ''}</div>
    ${rej ? '' : `${self ? `<input id="r_${esc(x.id)}" value="${esc(lvReason[x.id] || '')}" placeholder="ใบลาของตัวเอง — ใส่เหตุผลก่อนกดไม่อนุมัติ" style="width:100%;margin-top:10px">` : ''}
      <div class="row" style="margin-top:12px">${x.todo ? `<button class="small-btn green" data-ok="${esc(x.id)}" style="flex:1">✔️ ถูกต้อง</button>` : ''}
      <button class="small-btn red" data-no="${esc(x.id)}" style="flex:1">${armed === 'no' + x.id ? 'แตะอีกครั้ง' : 'ไม่อนุมัติ'}</button></div>`}
    ${adj ? moreBox(mid, `<div class="row" style="flex-wrap:nowrap"><span style="flex:1;font-weight:700">ปรับแรง (ตอนนี้ ${x.units})</span>
      <input type="number" min="0" max="10" id="u_${esc(x.id)}" value="${x.units}" style="width:80px">
      <button class="small-btn" data-units="${esc(x.id)}">บันทึก</button></div>`) : ''}</div>`;
  }).join('');

function bossPayHtml(r) {
  const items = r.items.map((x, i) => `<button class="item" data-slip="${i}" style="width:100%;text-align:left">

    ${items ? `<div class="list">${items}</div><div class="total"><span>รวม</span><span class="num">${baht(r.total)} บาท</span></div>` : '<div class="muted">ยังไม่มีข้อมูล</div>'}</div>
    <div id="slipBox"></div>

    <div class="more center">${moreBtn('pay', 'เพิ่มเติม')}</div>

      (r.lastClosed ? `<button class="btn quiet${armed === 'undoP' ? ' confirm' : ''}" id="pUndo" style="margin:0">${armed === 'undoP' ? 'แตะอีกครั้ง ล้างงวดจริง' : `ล้างงวด ${esc(r.lastClosed)}`}<small>ลบสลิปงวดล่าสุด ข้อมูลกลับมาแก้ได้</small></button>` : ''))}`;

function bossSetHtml(r) {
  const emps = r.emps.map((e, i) => `<div class="item" style="flex-wrap:wrap"><div class="main"><div class="name">${esc(e.name)}
      ${e.owner ? '<span class="pill">เจ้าของ</span>' : e.manager ? '<span class="pill blue">ผู้จัดการ</span>' : ''}</div><div class="sub">${esc(e.dept)}</div></div>
    <div class="row" style="width:100%"><input type="number" id="w${i}" value="${e.wage}" style="width:110px"><span class="muted">บ./วัน</span>

function wireBoss(app) {
  const r = bossCache[bossTab];
  if (!r || !r.ok) return;
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  if (bossTab === 'today') {
    const dt = document.getElementById('bdDate');
    if (dt) dt.onchange = () => { bossDate = dt.value; bossOpen = ''; bossCache.today = null; renderBoss(); loadBoss(); };
    app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { bossOpen = bossOpen === b.dataset.open ? '' : b.dataset.open; mgReason = ''; renderBoss(); });
    const mr = document.getElementById('mReason');
    if (mr) mr.oninput = () => { mgReason = mr.value; };
    app.querySelectorAll('[data-m]').forEach(b => b.onclick = async () => {
      const kind = b.dataset.m, reason = val('mReason').trim();
      if (bossOpen === S.me.name && !reason) return toast('⚠️ แก้ข้อมูลของตัวเองต้องใส่เหตุผลก่อน', 'bad');
      const res = await act('manage', { kind, name: bossOpen, date: r.key, reason,
        time: kind === 'editIn' ? val('mIn') : val('mOut'), baht: val('mBaht'), units: val('mUnits') });
      if (res && res.ok) { bossOpen = ''; mgReason = ''; loadBoss(); }
    });
    app.querySelectorAll('[data-unbind]').forEach(b => b.onclick = () => twoTap('unbind' + b.dataset.unbind, async () => {
      const res = await act('unbindStaff', { name: b.dataset.unbind });
      if (res && res.ok) { bossOpen = ''; loadBoss(); }
    }));
    const rc = document.getElementById('rcGo');
    if (rc) rc.onclick = () => twoTap('reclose', async () => { await doClose(val('rcTime')); loadBoss(); });
  }
  if (bossTab === 'leaves') {
    app.querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => { await act('decide', { id: b.dataset.ok, decision: 'อนุมัติ' }); loadBoss(); });
    app.querySelectorAll('[id^="r_"]').forEach(el => el.oninput = () => { lvReason[el.id.slice(2)] = el.value; });
    app.querySelectorAll('[data-no]').forEach(b => b.onclick = () => {
      const id = b.dataset.no, x = r.items.filter(i => i.id === id)[0], reason = val('r_' + id).trim();
      if (x && x.name === S.me.name && !reason) return toast('⚠️ ใบลาของตัวเองต้องใส่เหตุผลก่อน', 'bad');
      twoTap('no' + id, async () => { await act('decide', { id, decision: 'ปฏิเสธ', reason }); loadBoss(); });
    });
    app.querySelectorAll('[data-units]').forEach(b => b.onclick = async () => { await act('adjustUnits', { id: b.dataset.units, units: val('u_' + b.dataset.units) }); loadBoss(); });
  }
  if (bossTab === 'pay') {
    app.querySelectorAll('[data-slip]').forEach(el => el.onclick = () => {
      document.getElementById('slipBox').innerHTML = `<div class="card"><pre>${esc(r.items[+el.dataset.slip].slip)}</pre></div>`;
    });
    const pc = document.getElementById('pClose');
    if (pc) pc.onclick = () => twoTap('closeP', async () => { await act('closePeriod'); bossCache.pay = null; loadBoss(); });
    const pu = document.getElementById('pUndo');
    if (pu) pu.onclick = () => twoTap('undoP', async () => { await act('undoPeriod'); bossCache.pay = null; loadBoss(); });
  }
  if (bossTab === 'set') {
    app.querySelectorAll('[data-set]').forEach(b => b.onclick = async () => {
      const i = +b.dataset.set;
      const res = await act('setSetting', { key: r.items[i].key, value: val('set' + i) });
      if (res && res.ok) { await refresh(); loadBoss(); }
    });
    app.querySelectorAll('[data-wage]').forEach(b => b.onclick = async () => {
      const e = r.emps[+b.dataset.wage];
      const res = await act('setWage', { name: e.name, wage: val('w' + b.dataset.wage), reason: e.name === S.me.name ? 'เจ้าของตั้งค่าแรงตัวเอง' : '' });
      if (res && res.ok) loadBoss();
    });
    app.querySelectorAll('[data-role]').forEach(b => b.onclick = async () => {
      const e = r.emps[+b.dataset.role];
      const res = await act('setRole', { name: e.name, manager: !e.manager });
      if (res && res.ok) { await refresh(); loadBoss(); }
    });
    const sg = document.getElementById('setGps');
    if (sg) sg.onclick = async () => {
      if (busy.gps) return;
      busy.gps = true; renderBoss();
      let pos = null;
      try { pos = await getBestPosition(); } catch (e) { toast('❌ ' + e.message, 'bad', 9000); }
      busy.gps = false;
      if (!pos) return renderBoss();
      const res = await act('setShopGps', { lat: pos.coords.latitude, lng: pos.coords.longitude });
      if (res && res.ok) loadBoss(); else renderBoss();
    };
    const cp = document.getElementById('cpLink');
    if (cp) cp.onclick = () => copyText(val('shopLink'));
    const sc = document.getElementById('setCode');
    if (sc) sc.onclick = async () => { const res = await act('setCode', { code: val('newCode') }); if (res && res.ok) loadBoss(); };
  }
}

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('ก๊อปแล้วน้า~ ไปวางในกลุ่มร้านได้เลย', 'ok', 3000); }
  catch (e) { toast('ก๊อปเองได้เลย:\n' + t, 'warn', 9000); }
}
let qrLib = null;
function drawQr(el, text) {
  if (!el || !text) return;
  const go = () => { el.innerHTML = ''; new QRCode(el, { text, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M }); };
  if (window.QRCode) return go();
  if (!qrLib) qrLib = new Promise((ok, no) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    sc.onload = ok; sc.onerror = no; document.head.appendChild(sc);
  });
  qrLib.then(go).catch(() => { el.innerHTML = '<div class="muted" style="font-size:14px">โหลด QR ไม่ได้ ใช้ลิงก์แทน</div>'; });
}

function parsePaste(txt) {
  const out = [], errs = [];
  String(txt || '').split('\n').forEach((line, i) => {
    const t = line.trim().split(/\s+/).filter(String);
    if (!t.length) return;
    const wi = t.findIndex((x, j) => j > 0 && /^\d+(\.\d+)?$/.test(x.replace(/,/g, '')));
    if (wi < 0) { errs.push(`บรรทัด ${i + 1} “${t[0]}” ยังไม่มีค่าแรง`); return; }
    if (wi > 1) { errs.push(`บรรทัด ${i + 1} ชื่อต้องเป็นคำเดียว (“${t.slice(0, wi).join(' ')}”)`); return; }
    out.push({ name: t[0], wage: +t[wi].replace(/,/g, ''), dept: t.slice(wi + 1).join(' ') });
  });
  const seen = {};
  out.forEach(p => { if (seen[p.name] || p.name === wz.owner) errs.push(`ชื่อ “${p.name}” ซ้ำ`); seen[p.name] = 1; });
  return { staff: out, errs };
}

      <div class="field" style="margin:14px 0 0"><label for="wUntil">ใช้ได้ถึง (ไม่บังคับ)</label><input type="date" id="wUntil" value="${esc(wz.until)}"></div></div>
      <div class="note ok" style="margin-bottom:12px">สร้างแล้วยังแก้ทุกอย่างได้ในหน้าตั้งค่าร้าน</div>
      ${nav(!busy.adminCreateShop, busy.adminCreateShop ? '<span class="busy">กำลังสร้าง</span>' : 'สร้างร้าน')}`;
  }
  app.innerHTML = h;

  const $ = id => document.getElementById(id);
  const bind = (id, key, ev) => { const el = $(id); if (el) el[ev || 'oninput'] = () => { wz[key] = el.type === 'checkbox' ? el.checked : el.value; saveWz(); if (id === 'wName' || id === 'wOwner') { const nx = $('wzNext'); if (nx) nx.disabled = !(wz.name.trim() && wz.owner.trim() && !/\s/.test(wz.owner.trim())); } }; };
  bind('wName', 'name'); bind('wOwner', 'owner'); bind('wOpen', 'open', 'onchange'); bind('wClose', 'close', 'onchange');
  bind('wOt', 'ot', 'onchange'); bind('wFood', 'food', 'onchange'); bind('wFine', 'fine', 'onchange'); bind('wUntil', 'until', 'onchange');
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    const i = wz.holidays.indexOf(b.dataset.d);
    if (i >= 0) wz.holidays.splice(i, 1); else wz.holidays.push(b.dataset.d);
    saveWz(); renderWizard(app);
  });
  app.querySelectorAll('[data-type]').forEach(b => b.onclick = () => {
    const t = TYPES.filter(x => x.id === b.dataset.type)[0];
    wz.type = t.id; if (t.id !== 'custom') { wz.ot = t.ot; wz.food = t.food; }
    saveWz(); renderWizard(app);
  });
  const pa = $('wPaste');
  if (pa) pa.oninput = () => {
    wz.paste = pa.value; saveWz();
    const p = parsePaste(wz.paste);
    $('wPrev').innerHTML = pasteNote(p);
    $('wzNext').disabled = !!p.errs.length;
  };
  const g = $('wzGps');
  if (g) g.onclick = async () => {
    wz.gps = 'busy'; renderWizard(app);
    try { const pos = await getBestPosition(); wz.lat = pos.coords.latitude; wz.lng = pos.coords.longitude; wz.gps = ''; }
    catch (e) { wz.gps = e.message; }
    saveWz(); if (adm.view === 'wizard') renderWizard(app);
  };
  $('wzBack').onclick = () => {
    if (wz.step === 1) { adm = { view: 'home' }; renderAdmin(); loadAdmin(); return; }
    wz.step--; saveWz(); renderWizard(app);
  };
  $('wzNext').onclick = async () => {
    if (wz.step < 4) { wz.step++; saveWz(); renderWizard(app); window.scrollTo(0, 0); return; }
    const p = parsePaste(wz.paste);
    const res = await act('adminCreateShop', { name: wz.name.trim(), owner: wz.owner.trim(), lat: wz.lat, lng: wz.lng,
      open: wz.open, close: wz.close, holidays: wz.holidays, type: wz.type, ot: wz.ot, food: wz.food, fine: wz.fine,
      staff: p.staff, until: wz.until });
    if (res && res.ok) {
      adm = { view: 'done', res: Object.assign({ owner: wz.owner.trim() }, res) }; wz = WZ_NEW();
      try { localStorage.removeItem(WZ_KEY); } catch (e) {}
      renderAdmin();
    } else renderWizard(app);
  };
}
function pasteNote(p) {
  if (p.errs.length) return p.errs.map(e => `<div class="note bad">${esc(e)}</div>`).join('');
  if (!p.staff.length) return '<div class="note warn">ยังไม่มีพนักงาน — เพิ่มทีหลังได้</div>';
  return `<div class="note ok">พร้อมเพิ่ม ${p.staff.length} คน: ${p.staff.map(x => esc(x.name)).join(', ')}</div>`;
}

function renderDone(app) {
  const r = adm.res, id = r.shop.id;
  app.innerHTML = `
    <div class="card hero" style="background:var(--brand-500);border-color:var(--brand-500)"><div class="hm">${nongSvg('party', 120)}</div>
      <h2 style="margin:4px 0 0;font-size:26px">สร้างร้านเสร็จแล้ว!</h2><div style="font-weight:700">${esc(r.shop.name)}</div></div>
    <div class="card"><div class="row" style="flex-wrap:nowrap;align-items:center;gap:14px"><div class="qr" id="qrBox"></div>
      <div style="min-width:0"><div class="muted" style="font-weight:700">รหัสร้าน</div><div class="bigcode">${esc(id)}</div>
        <div class="muted" style="font-weight:700;margin-top:6px">รหัส 4 ตัว</div><div class="bigcode" style="font-size:28px">${esc(r.code)}</div></div></div>
      ${r.link ? `<div class="row" style="margin-top:12px"><input value="${esc(r.link)}" readonly style="flex:1" id="dLink"><button class="small-btn" id="dCopy">ก๊อปลิงก์</button></div>` : '<div class="note warn">ยังไม่ได้ตั้ง LIFF_ID — ลิงก์ยังสร้างไม่ได้</div>'}</div>
    <div class="card"><h2>เหลืออีก 3 อย่าง (ทำในไลน์ ไม่ต้องเขียนโค้ด)</h2>
      <div class="ck"><b class="n">1</b><div>เชิญบอท <b>โคตรพร้อม</b> เข้ากลุ่มไลน์ของร้าน</div></div>
      <div class="ck"><b class="n">2</b><div>พิมพ์ในกลุ่ม <code>ผูกร้าน ${esc(id)} ${esc(r.code)}</code></div></div>
      <div class="ck"><b class="n">3</b><div>ส่งลิงก์/QR ให้ทุกคน แตะแล้วเลือกชื่อตัวเอง + ใส่รหัส ${esc(r.code)}<br><span class="muted">เจ้าของร้าน (${esc(adm.res.owner || '')}) ก็ทำแบบเดียวกัน</span></div></div>
      ${r.gps ? '' : '<div class="note warn">ยังไม่มีพิกัดร้าน — เจ้าของต้องตั้ง พิกัดร้าน-lat / lng ในหน้าตั้งค่าก่อนเปิดใช้</div>'}</div>
    <button class="btn quiet" id="dShop">ดูพนักงานของร้านนี้</button><div class="gap"></div>
    <button class="btn quiet" id="dHome">กลับหน้าร้านทั้งหมด</button>`;
  drawQr(document.getElementById('qrBox'), r.link);
  const c = document.getElementById('dCopy'); if (c) c.onclick = () => copyText(r.link);
  document.getElementById('dShop').onclick = () => { adm = { view: 'shop', shop: id }; admData.shop = null; renderAdmin(); loadAdmin(); };
  document.getElementById('dHome').onclick = () => { adm = { view: 'home' }; admData.home = null; renderAdmin(); loadAdmin(); };
}

let admOpen = '';
function renderAdmShop(app) {
  const r = admData.shop;
  if (!r) { app.innerHTML = loadingHtml(); return; }
  if (!r.ok) { app.innerHTML = `<div class="card"><div class="note bad">${esc(r.error || r.text)}</div></div><button class="btn quiet" id="sBack">กลับ</button>`; document.getElementById('sBack').onclick = () => { adm = { view: 'home' }; renderAdmin(); loadAdmin(); }; return; }
  const sh = r.shop, closed = sh.status === 'ปิด';
  const emps = r.staff.map((e, i) => {
    const open = admOpen === e.name;
    const pill = e.left ? '<span class="pill">ออกแล้ว</span>' : e.bound ? '<span class="pill ok">ผูกเครื่องแล้ว</span>' : '<span class="pill warn">ยังไม่ผูก</span>';
    return `<div class="item" style="flex-wrap:wrap${e.left ? ';opacity:.6' : ''}"><div class="main"><div class="name">${esc(e.name)}${e.role ? ` <span class="pill">${esc(e.role)}</span>` : ''}</div>
      <div class="sub">${esc(e.dept || '-')} · ${baht(e.wage)} บ./วัน</div></div>${pill}
      <button class="small-btn ghost" data-eo="${esc(e.name)}">${open ? 'ปิด' : 'แก้'}</button>
      ${open ? `<div class="mbox" style="width:100%">
        <div class="row mrow"><span class="mlabel">ค่าแรง/วัน</span><input type="number" id="eW${i}" value="${e.wage}" style="width:110px"><button class="small-btn" data-ew="${i}">บันทึก</button></div>
        <div class="row mrow"><span class="mlabel">แผนก</span><input id="eD${i}" value="${esc(e.dept)}" style="width:130px"><button class="small-btn" data-ed="${i}">บันทึก</button></div>
        <div class="more">${moreBtn('ae', 'เพิ่มเติม')}</div>
        ${moreBox('ae', (e.bound ? `<div class="row mrow" style="margin-top:0"><span class="mlabel">ย้ายเครื่อง (ปลดเครื่องเดิม)</span><button class="small-btn red" data-eu="${i}">${armed === 'eu' + i ? 'แตะอีกครั้ง' : 'ปลด'}</button></div>` : '') +
          `<div class="row mrow"><span class="mlabel">${e.left ? 'กลับมาทำงาน' : 'ให้ออก (เก็บประวัติไว้)'}</span><button class="small-btn ${e.left ? '' : 'red'}" data-el="${i}">${armed === 'el' + i ? 'แตะอีกครั้ง' : e.left ? 'กลับมา' : 'ให้ออก'}</button></div>`)}
      </div>` : ''}</div>`;
  }).join('');
  app.innerHTML = `
    <div class="card"><div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div style="flex:1;min-width:0"><h2 style="margin:0">${esc(sh.name)}</h2>
      <div class="muted">รหัสร้าน <b>${esc(sh.id)}</b> · รหัส 4 ตัว <b>${esc(r.code)}</b></div>
      <div style="margin-top:6px">${closed ? '<span class="pill bad">ปิดอยู่</span>' : '<span class="pill ok">ใช้งาน</span>'} ${sh.group ? '<span class="pill ok">ผูกกลุ่มแล้ว</span>' : '<span class="pill warn">ยังไม่ผูกกลุ่ม</span>'}</div></div>
      <div class="qr" id="qrBox" style="width:112px;height:112px"></div></div>
      ${r.link ? `<div class="row" style="margin-top:10px"><input value="${esc(r.link)}" readonly style="flex:1" id="sLink"><button class="small-btn" id="sCopy">ก๊อป</button></div>` : ''}
      ${sh.group ? '' : `<div class="note warn">ยังไม่ผูกกลุ่ม: เชิญบอทเข้ากลุ่มร้าน แล้วพิมพ์ <b>ผูกร้าน ${esc(sh.id)} ${esc(r.code)}</b></div>`}</div>
    <div class="card"><h2>เพิ่มพนักงาน</h2><div class="row" style="flex-wrap:nowrap">
      <input id="nName" placeholder="ชื่อเล่น" style="flex:1;min-width:0"><input id="nWage" type="number" placeholder="ค่าแรง" style="width:96px"></div>
      <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="nDept" placeholder="แผนก (ไม่บังคับ)" style="flex:1;min-width:0"><button class="small-btn" id="nAdd">เพิ่ม</button></div></div>
    <div class="card"><h2>พนักงาน ${r.staff.filter(e => !e.left).length} คน</h2><div class="list">${emps || '<div class="muted">ยังไม่มีพนักงาน</div>'}</div></div>
    <div class="more center">${moreBtn('as', 'การใช้งานร้าน')}</div>
    ${moreBox('as', `<div class="card"><h2>การใช้งาน</h2><div class="row"><span style="flex:1;font-weight:700">ใช้ได้ถึง</span><input type="date" id="sUntil" value="${esc(sh.until)}"><button class="small-btn" id="sUntilGo">บันทึก</button></div>
      <div class="gap" style="height:12px"></div>
      <button class="btn quiet${armed === 'sClose' ? ' confirm' : ''}" id="sClose" style="margin:0">${armed === 'sClose' ? 'แตะอีกครั้ง ยืนยัน' : closed ? 'เปิดใช้งานร้านอีกครั้ง' : 'ปิดการใช้งานร้าน'}<small>${closed ? 'พนักงานกลับมาใช้ได้ทันที' : 'พนักงานร้านนี้จะใช้ไม่ได้ (ข้อมูลยังอยู่)'}</small></button></div>`)}
    <div class="gap"></div>
    <button class="btn quiet" id="sBack">กลับหน้าร้านทั้งหมด</button>`;
  drawQr(document.getElementById('qrBox'), r.link);
  const $ = id => document.getElementById(id);
  const edit = async (body, keepOpen) => { const res = await act('adminStaffEdit', Object.assign({ shop: sh.id }, body)); if (res && res.ok) { if (!keepOpen) admOpen = ''; loadAdmin(); } };
  const cp = $('sCopy'); if (cp) cp.onclick = () => copyText(r.link);
  $('sBack').onclick = () => { adm = { view: 'home' }; admData.home = null; renderAdmin(); loadAdmin(); };
  $('nAdd').onclick = () => {
    const name = $('nName').value.trim(), wage = $('nWage').value;
    if (!name || /\s/.test(name)) return toast('ใส่ชื่อเล่นคำเดียวก่อนนะ', 'bad');
    if (wage === '') return toast('ใส่ค่าแรงด้วยนะ', 'bad');
    edit({ op: 'add', name, wage: +wage, dept: $('nDept').value.trim() });
  };
  app.querySelectorAll('[data-eo]').forEach(b => b.onclick = () => { admOpen = admOpen === b.dataset.eo ? '' : b.dataset.eo; renderAdmShop(app); });
  app.querySelectorAll('[data-ew]').forEach(b => b.onclick = () => { const e = r.staff[+b.dataset.ew]; edit({ op: 'wage', name: e.name, wage: +$('eW' + b.dataset.ew).value }, true); });
  app.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { const e = r.staff[+b.dataset.ed]; edit({ op: 'dept', name: e.name, dept: $('eD' + b.dataset.ed).value }, true); });
  app.querySelectorAll('[data-eu]').forEach(b => b.onclick = () => twoTap('eu' + b.dataset.eu, () => edit({ op: 'unbind', name: r.staff[+b.dataset.eu].name })));
  app.querySelectorAll('[data-el]').forEach(b => b.onclick = () => twoTap('el' + b.dataset.el, () => { const e = r.staff[+b.dataset.el]; edit({ op: e.left ? 'back' : 'leave', name: e.name }); }));
  if ($('sUntilGo')) $('sUntilGo').onclick = async () => { const res = await act('adminSetShop', { shop: sh.id, until: $('sUntil').value }); if (res && res.ok) loadAdmin(); };
  if ($('sClose')) $('sClose').onclick = () => twoTap('sClose', async () => { const res = await act('adminSetShop', { shop: sh.id, status: closed ? 'ใช้งาน' : 'ปิด' }); if (res && res.ok) loadAdmin(); });
}
</script>
</body>
</html>
